<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>QR Sender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0c0f;
      --surface: #16161a;
      --surface2: #1e1e24;
      --border: #2a2a32;
      --text: #e8e8ed;
      --text-dim: #8a8a96;
      --accent: #6c5ce7;
      --accent-glow: rgba(108, 92, 231, 0.25);
      --green: #00c853;
      --red: #ff3d57;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 8px 10px max(10px, env(safe-area-inset-bottom));
      gap: 8px;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* ---- Header ---- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      height: 32px;
    }
    .header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .status-strip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.74rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--red);
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .sep {
      color: var(--border);
      font-weight: 300;
      font-size: 0.8rem;
    }
    .strip-val {
      color: var(--text);
      font-weight: 600;
    }

    /* ---- Camera Wrap ---- */
    .camera-wrap {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .scan-overlay {
      position: absolute;
      border: 2px solid var(--accent);
      border-radius: 6px;
      pointer-events: none;
      transition: all 0.08s ease-out;
      box-shadow: 0 0 12px var(--accent-glow);
      display: none;
      z-index: 2;
    }
    .hud-badge {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(12, 12, 15, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: var(--text);
      font-size: 0.72rem;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 999px;
      pointer-events: none;
      z-index: 3;
      white-space: nowrap;
      max-width: 90%;
      text-overflow: ellipsis;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* ---- Controls Section ---- */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Ready Button (Primary Action) */
    .ready-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: var(--radius);
      border: 1px solid rgba(108, 92, 231, 0.45);
      background: linear-gradient(135deg, #6c5ce7 0%, #4834d4 100%);
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: 0 3px 14px rgba(108, 92, 231, 0.35);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      height: 44px;
    }
    .ready-btn:hover {
      background: linear-gradient(135deg, #7d6dfa 0%, #5742e8 100%);
      box-shadow: 0 5px 18px rgba(108, 92, 231, 0.5);
    }
    .ready-btn:active {
      transform: scale(0.98);
    }
    .ready-btn .btn-icon {
      font-size: 1.15rem;
      display: inline-block;
    }

    /* Ringing active state */
    .ready-btn.ringing {
      background: linear-gradient(135deg, #ff3d57 0%, #d63031 100%);
      border-color: rgba(255, 61, 87, 0.7);
      box-shadow: 0 0 20px rgba(255, 61, 87, 0.65);
      animation: btnPulse 1s infinite alternate;
    }
    .ready-btn.ringing .btn-icon {
      animation: bellShake 0.5s infinite;
    }

    @keyframes btnPulse {
      0% { box-shadow: 0 0 10px rgba(255, 61, 87, 0.4); transform: scale(1); }
      100% { box-shadow: 0 0 24px rgba(255, 61, 87, 0.9); transform: scale(1.015); }
    }
    @keyframes bellShake {
      0%, 100% { transform: rotate(0); }
      20% { transform: rotate(14deg); }
      40% { transform: rotate(-14deg); }
      60% { transform: rotate(10deg); }
      80% { transform: rotate(-10deg); }
    }

    /* Compact Toolbar: Camera & Zoom in ONE slim row */
    .toolbar-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      height: 38px;
    }
    .tool-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .tool-icon {
      font-size: 0.85rem;
      opacity: 0.75;
      flex-shrink: 0;
    }
    select.compact-select {
      flex: 1;
      min-width: 0;
      background: transparent;
      color: var(--text);
      border: none;
      font-size: 0.78rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
      padding: 0;
    }
    select.compact-select option {
      background: var(--surface2);
      color: var(--text);
    }
    .tool-chip input[type="range"] {
      flex: 1;
      min-width: 0;
      accent-color: var(--accent);
      height: 4px;
      cursor: pointer;
    }
    .zoom-val {
      font-size: 0.75rem;
      font-weight: 600;
      min-width: 28px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>QR Sender</h1>
      <div class="status-strip">
        <span id="dot" class="dot"></span>
        <span id="connLabel">Offline</span>
        <span class="sep">•</span>
        <span class="strip-val" id="peersVal">S:0 V:0</span>
        <span class="sep">•</span>
        <span class="strip-val" id="latencyVal">—</span>
      </div>
    </div>

    <div class="camera-wrap">
      <div class="hud-badge" id="statusVal">Starting camera…</div>
      <video id="video" autoplay playsinline muted></video>
      <div id="scanOverlay" class="scan-overlay"></div>
    </div>

    <div class="controls">
      <button id="readyBtn" class="ready-btn" type="button">
        <span class="btn-icon">🔔</span>
        <span class="btn-text">Ready (Ring Viewer)</span>
      </button>

      <div class="toolbar-row">
        <div class="tool-chip">
          <span class="tool-icon">📷</span>
          <select id="camSelect" class="compact-select"></select>
        </div>
        <div class="tool-chip">
          <span class="tool-icon">🔍</span>
          <input id="zoomSlider" type="range" min="1" max="1" step="0.1" value="1" disabled />
          <span class="zoom-val" id="zoomVal">1.0×</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    /* ========== DOM refs ========== */
    const video      = document.getElementById('video');
    const overlay    = document.getElementById('scanOverlay');
    const dot        = document.getElementById('dot');
    const connLabel  = document.getElementById('connLabel');
    const latencyVal = document.getElementById('latencyVal');
    const peersVal   = document.getElementById('peersVal');
    const statusVal  = document.getElementById('statusVal');
    const camSelect  = document.getElementById('camSelect');
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomVal    = document.getElementById('zoomVal');
    const readyBtn   = document.getElementById('readyBtn');

    /* ========== State ========== */
    const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const wsUrl   = `${wsProto}://${location.host}/ws`;
    let socket = null;
    let videoTrack = null;
    let activeStream = null;
    let lastQRText = null;
    let scanStarted = false;
    let lastScanTime = 0;
    let isRinging = false;
    let ringAutoResetTimer = null;
    let viewerCount = 0;

    // Offscreen canvases — allocated once, reused every frame
    const detectCanvas = document.createElement('canvas');
    const detectCtx    = detectCanvas.getContext('2d', { willReadFrequently: true });
    const cropCanvas   = document.createElement('canvas');
    const cropCtx      = cropCanvas.getContext('2d');

    // BarcodeDetector singleton (if supported)
    let nativeDetector = null;
    let useNative = false;
    (async () => {
      if (window.BarcodeDetector) {
        try {
          const formats = await BarcodeDetector.getSupportedFormats();
          if (formats.includes('qr_code')) {
            nativeDetector = new BarcodeDetector({ formats: ['qr_code'] });
            useNative = true;
          }
        } catch (_) { /* fallback to jsQR */ }
      }
    })();

    /* ========== Ready Alert (Ring Viewers) ========== */
    function setRingingState(active) {
      isRinging = active;
      clearTimeout(ringAutoResetTimer);
      const icon = readyBtn ? readyBtn.querySelector('.btn-icon') : null;
      const text = readyBtn ? readyBtn.querySelector('.btn-text') : null;

      if (isRinging) {
        if (readyBtn) readyBtn.classList.add('ringing');
        if (icon) icon.textContent = '🔕';
        if (text) text.textContent = 'Ringing Viewers... (Click to Stop)';
        statusVal.textContent = viewerCount > 0
          ? `Ready signal sent to ${viewerCount} viewer(s)`
          : 'Ready signal sent (No viewers online)';

        // Auto-reset after 15 seconds to prevent runaway ringing
        ringAutoResetTimer = setTimeout(() => {
          stopRinging();
        }, 15000);
      } else {
        if (readyBtn) readyBtn.classList.remove('ringing');
        if (icon) icon.textContent = '🔔';
        if (text) text.textContent = 'Ready (Ring Viewer)';
      }
    }

    function sendRingSignal(action) {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'ring', action: action }));
        return true;
      }
      return false;
    }

    function startRinging() {
      if (sendRingSignal('start')) {
        setRingingState(true);
      } else {
        statusVal.textContent = 'Cannot ring: Offline';
      }
    }

    function stopRinging() {
      sendRingSignal('stop');
      setRingingState(false);
      statusVal.textContent = 'Ringing stopped';
    }

    if (readyBtn) {
      readyBtn.addEventListener('click', () => {
        if (isRinging) {
          stopRinging();
        } else {
          startRinging();
        }
      });
    }

    /* ========== WebSocket ========== */
    let pingTimer = null;

    function connectWS() {
      socket = new WebSocket(wsUrl);
      socket.binaryType = 'arraybuffer';

      socket.addEventListener('open', () => {
        dot.classList.add('on');
        connLabel.textContent = 'Online';
        socket.send(JSON.stringify({ type: 'role', role: 'sender' }));

        clearInterval(pingTimer);
        pingTimer = setInterval(() => {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: 'ping' }));
          }
        }, 20000);
      });

      socket.addEventListener('message', (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg && msg.type === 'status') {
            viewerCount = msg.viewers || 0;
            peersVal.textContent = `S:${msg.senders} V:${msg.viewers}`;
          }
        } catch (_) { /* binary or non-JSON — ignore on sender */ }
      });

      socket.addEventListener('close', () => {
        clearInterval(pingTimer);
        dot.classList.remove('on');
        connLabel.textContent = 'Offline';
        if (isRinging) setRingingState(false);
        setTimeout(connectWS, 1500);
      });

      socket.addEventListener('error', () => {
        socket.close();
      });
    }
    connectWS();

    /* ========== Camera ========== */
    async function startCamera(deviceId) {
      try {
        if (activeStream) activeStream.getTracks().forEach(t => t.stop());

        const constraint = deviceId
          ? { deviceId: { exact: deviceId } }
          : { facingMode: 'environment' };
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { ...constraint, width: { ideal: 1280 }, height: { ideal: 960 } },
          audio: false,
        });

        activeStream = stream;
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0] || null;
        setupZoom(videoTrack);
        await populateCameras(videoTrack?.getSettings?.()?.deviceId);
        statusVal.textContent = 'Camera active — scanning';

        if (!scanStarted) {
          scanStarted = true;
          requestAnimationFrame(tick);
        }
      } catch (err) {
        statusVal.textContent = `Camera error: ${err.message}`;
      }
    }

    async function populateCameras(currentId) {
      if (!navigator.mediaDevices?.enumerateDevices) return;
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(d => d.kind === 'videoinput');
      camSelect.innerHTML = '';
      cams.forEach((c, i) => {
        const opt = document.createElement('option');
        opt.value = c.deviceId;
        opt.textContent = c.label || `Camera ${i + 1}`;
        camSelect.appendChild(opt);
      });
      if (currentId) camSelect.value = currentId;
    }

    camSelect.addEventListener('change', () => {
      if (camSelect.value) startCamera(camSelect.value);
    });

    function setupZoom(track) {
      if (!track?.getCapabilities) { zoomSlider.disabled = true; return; }
      const caps = track.getCapabilities();
      if (!caps.zoom) { zoomSlider.disabled = true; return; }
      zoomSlider.min = String(caps.zoom.min ?? 1);
      zoomSlider.max = String(caps.zoom.max ?? 1);
      zoomSlider.step = String(caps.zoom.step ?? 0.1);
      const init = Number(track.getSettings?.()?.zoom ?? caps.zoom.min ?? 1);
      zoomSlider.value = String(init);
      zoomVal.textContent = `${init.toFixed(1)}×`;
      zoomSlider.disabled = false;
      zoomSlider.oninput = async () => {
        const v = Number(zoomSlider.value);
        zoomVal.textContent = `${v.toFixed(1)}×`;
        try { await track.applyConstraints({ advanced: [{ zoom: v }] }); } catch (_) {}
      };
    }

    /* ========== Detection & Crop Loop ========== */
    const SCAN_INTERVAL = 120; // ms — ~8 Hz
    const DETECT_MAX_DIM = 480; // downscale for fast detection
    const CROP_SIZE = 300;      // export crop canvas size

    async function tick() {
      requestAnimationFrame(tick);
      if (video.readyState < video.HAVE_ENOUGH_DATA) return;

      const now = performance.now();
      if (now - lastScanTime < SCAN_INTERVAL) return;
      lastScanTime = now;

      // ---- Downscale for detection ----
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return;

      const scale = Math.min(DETECT_MAX_DIM / vw, DETECT_MAX_DIM / vh, 1);
      const dw = Math.round(vw * scale);
      const dh = Math.round(vh * scale);

      if (detectCanvas.width !== dw || detectCanvas.height !== dh) {
        detectCanvas.width = dw;
        detectCanvas.height = dh;
      }
      detectCtx.drawImage(video, 0, 0, dw, dh);

      let qrText = null;
      let bbox = null; // { x, y, w, h } in DETECT canvas coords

      // ---- Try native BarcodeDetector ----
      if (useNative && nativeDetector) {
        try {
          const results = await nativeDetector.detect(detectCanvas);
          if (results.length > 0) {
            qrText = results[0].rawValue;
            const bb = results[0].boundingBox;
            bbox = { x: bb.x, y: bb.y, w: bb.width, h: bb.height };
          }
        } catch (_) { /* fall through to jsQR */ }
      }

      // ---- jsQR fallback ----
      if (!qrText) {
        try {
          const imgData = detectCtx.getImageData(0, 0, dw, dh);
          const code = jsQR(imgData.data, dw, dh);
          if (code && code.data) {
            qrText = code.data;
            // Compute bounding box from corner locations
            const loc = code.location;
            const xs = [loc.topLeftCorner.x, loc.topRightCorner.x, loc.bottomLeftCorner.x, loc.bottomRightCorner.x];
            const ys = [loc.topLeftCorner.y, loc.topRightCorner.y, loc.bottomLeftCorner.y, loc.bottomRightCorner.y];
            const minX = Math.min(...xs);
            const minY = Math.min(...ys);
            bbox = {
              x: minX,
              y: minY,
              w: Math.max(...xs) - minX,
              h: Math.max(...ys) - minY,
            };
          }
        } catch (_) {}
      }

      // ---- No QR found ----
      if (!qrText || !bbox) {
        overlay.style.display = 'none';
        return;
      }

      // ---- Show overlay on the video element ----
      showOverlay(bbox, scale);

      // ---- Only send if QR content changed ----
      if (qrText === lastQRText) return;
      lastQRText = qrText;

      // ---- Crop from FULL-RES video frame ----
      // Convert detect-canvas bbox back to full-res coords
      const pad = 0.25; // 25% extra area around QR
      const fx = bbox.x / scale;
      const fy = bbox.y / scale;
      const fw = bbox.w / scale;
      const fh = bbox.h / scale;

      // Make it square: use the larger side, then add padding
      const side = Math.max(fw, fh);
      const padded = side * (1 + pad * 2);
      // Center the square on the QR center
      const centerX = fx + fw / 2;
      const centerY = fy + fh / 2;
      const cx = Math.max(0, Math.round(centerX - padded / 2));
      const cy = Math.max(0, Math.round(centerY - padded / 2));
      const cw = Math.min(Math.round(padded), vw - cx);
      const ch = Math.min(Math.round(padded), vh - cy);
      // Keep it square after clamping
      const cropSide = Math.min(cw, ch);

      cropCanvas.width = CROP_SIZE;
      cropCanvas.height = CROP_SIZE;
      cropCtx.drawImage(video, cx, cy, cropSide, cropSide, 0, 0, CROP_SIZE, CROP_SIZE);

      // ---- Apply Grayscale & Boost Contrast ----
      try {
        const imgData = cropCtx.getImageData(0, 0, CROP_SIZE, CROP_SIZE);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i];
          const g = d[i + 1];
          const b = d[i + 2];
          // Grayscale conversion using luminance formula
          let gray = 0.299 * r + 0.587 * g + 0.114 * b;
          
          // Boost contrast (values below 128 go darker, values above go lighter)
          // factor of 3.5 gives a strong, clean separation of black and white modules
          const factor = 3.5;
          gray = factor * (gray - 128) + 128;
          gray = Math.max(0, Math.min(255, gray));

          d[i] = gray;
          d[i + 1] = gray;
          d[i + 2] = gray;
        }
        cropCtx.putImageData(imgData, 0, 0);
      } catch (e) {
        console.error("Failed to apply grayscale/contrast filter:", e);
      }

      // ---- Compress & send ----
      const t0 = performance.now();
      const decodedText = qrText; // capture for closure
      cropCanvas.toBlob((blob) => {
        if (!blob) return;
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(blob);
          const elapsed = Math.round(performance.now() - t0);
          latencyVal.textContent = `${elapsed}ms`;
          statusVal.textContent = `Sent crop (${(blob.size / 1024).toFixed(1)} KB)`;
        } else {
          statusVal.textContent = 'Detected — WS not connected';
        }
      }, 'image/png');
    }

    function showOverlay(bbox, scale) {
      const rect = video.getBoundingClientRect();
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh || !rect.width || !rect.height) return;

      // Calculate object-fit: cover geometry
      const videoRatio = vw / vh;
      const elemRatio = rect.width / rect.height;
      let renderW, renderH, offsetX, offsetY;

      if (elemRatio > videoRatio) {
        renderW = rect.width;
        renderH = rect.width / videoRatio;
        offsetX = 0;
        offsetY = (rect.height - renderH) / 2;
      } else {
        renderH = rect.height;
        renderW = rect.height * videoRatio;
        offsetX = (rect.width - renderW) / 2;
        offsetY = 0;
      }

      const elScale = renderW / vw;
      const ox = (bbox.x / scale) * elScale + offsetX;
      const oy = (bbox.y / scale) * elScale + offsetY;
      const ow = (bbox.w / scale) * elScale;
      const oh = (bbox.h / scale) * elScale;

      overlay.style.display = 'block';
      overlay.style.left   = `${Math.round(ox)}px`;
      overlay.style.top    = `${Math.round(oy)}px`;
      overlay.style.width  = `${Math.round(ow)}px`;
      overlay.style.height = `${Math.round(oh)}px`;
    }

    /* ========== Init ========== */
    startCamera();
  </script>
</body>
</html>
