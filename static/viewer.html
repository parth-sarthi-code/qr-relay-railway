<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QR Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0c0f;
      --surface: #16161a;
      --border: #2a2a32;
      --text: #e8e8ed;
      --text-dim: #8a8a96;
      --accent: #6c5ce7;
      --green: #00c853;
      --red: #ff3d57;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 600px;
      width: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* ---- Header ---- */
    .header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 0.78rem;
      font-weight: 500;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--red);
      transition: background 0.3s;
    }
    .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }

    /* ---- QR Image Display ---- */
    .qr-frame {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .qr-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
    .qr-frame img.visible { display: block; }
    .placeholder {
      color: var(--text-dim);
      font-size: 0.9rem;
      font-weight: 500;
      text-align: center;
      padding: 20px;
    }
    .placeholder.hidden { display: none; }

    /* Subtle flash on update */
    @keyframes flash {
      0% { box-shadow: 0 0 0 0 rgba(108, 92, 231, 0.5); }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
    .qr-frame.flash {
      animation: flash 0.35s ease-out;
    }

    /* ---- Info Bar ---- */
    .info-bar {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .info-cell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      text-align: center;
    }
    .info-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .info-value {
      font-size: 1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .decoded-card {
      width: 100%;
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>QR Viewer</h1>
      <div class="status-pill">
        <span id="dot" class="dot"></span>
        <span id="connLabel">Offline</span>
      </div>
    </div>

    <div class="qr-frame" id="qrFrame">
      <img id="qrImg" alt="QR Code" />
      <div class="placeholder" id="placeholder">Waiting for QR image from sender…</div>
    </div>

    <div class="info-bar">
      <div class="info-cell">
        <div class="info-label">Senders</div>
        <div class="info-value" id="sendersVal">0</div>
      </div>
      <div class="info-cell">
        <div class="info-label">Viewers</div>
        <div class="info-value" id="viewersVal">0</div>
      </div>
      <div class="info-cell">
        <div class="info-label">Last Update</div>
        <div class="info-value" id="timeVal">—</div>
      </div>
    </div>
  </div>

  <script>
    /* ========== DOM refs ========== */
    const dot         = document.getElementById('dot');
    const connLabel   = document.getElementById('connLabel');
    const qrFrame     = document.getElementById('qrFrame');
    const qrImg       = document.getElementById('qrImg');
    const placeholder = document.getElementById('placeholder');
    const sendersVal  = document.getElementById('sendersVal');
    const viewersVal  = document.getElementById('viewersVal');
    const timeVal     = document.getElementById('timeVal');

    /* ========== State ========== */
    const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const wsUrl   = `${wsProto}://${location.host}/ws`;
    let socket = null;
    let prevObjectURL = null;

    /* ========== WebSocket ========== */
    function connectWS() {
      socket = new WebSocket(wsUrl);
      socket.binaryType = 'blob';

      socket.addEventListener('open', () => {
        dot.classList.add('on');
        connLabel.textContent = 'Online';
        socket.send(JSON.stringify({ type: 'role', role: 'viewer' }));
      });

      socket.addEventListener('message', (ev) => {
        // Binary blob — QR image
        if (ev.data instanceof Blob) {
          displayImage(ev.data);
          return;
        }
        // Text — JSON status
        try {
          const msg = JSON.parse(ev.data);
          if (msg && msg.type === 'status') {
            sendersVal.textContent = msg.senders;
            viewersVal.textContent = msg.viewers;
          }
        } catch (_) {}
      });

      socket.addEventListener('close', () => {
        dot.classList.remove('on');
        connLabel.textContent = 'Offline';
        setTimeout(connectWS, 1000);
      });

      socket.addEventListener('error', () => {
        socket.close();
      });
    }

    /* ========== Image Display ========== */
    function displayImage(blob) {
      // Revoke previous URL to prevent memory leak
      if (prevObjectURL) {
        URL.revokeObjectURL(prevObjectURL);
      }
      const url = URL.createObjectURL(blob);
      prevObjectURL = url;

      qrImg.src = url;
      qrImg.classList.add('visible');
      placeholder.classList.add('hidden');

      // Flash animation
      qrFrame.classList.remove('flash');
      void qrFrame.offsetWidth; // force reflow to restart animation
      qrFrame.classList.add('flash');

      // Timestamp
      const now = new Date();
      timeVal.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    /* ========== Init ========== */
    connectWS();
  </script>
</body>
</html>
